Catalog_dir: '/home/alab_student/Tim/Projects/MeV_Blazars/Data/'
out_file_name: 'MeV_Blazar_Fits_LP_results.fits'

out_dir: '/home/alab_student/Tim/Projects/MeV_Blazars/Outputs/Blazar_Fitter_out/Matched_Blazar_Fits_LP/'
fsrq_out: 'fsrq/'
bll_out: 'bll/'
bcu_out: 'bcu/'

Catalog_Name: 'MeV_Blazar_Catalog_v2.fits'

Fitting_X_ray_data: True
Fitting_Gamma_ray_data: True
Show_sensitivity_curve: False

columns:
  source_name: 'Fermi_Counterpart_Name'
  source_class: 'Fermi_Type'
  source_SED_class: 'SED_Class'
  energy_bands: 'Energy'
  energy_units: 'MeV'
  energy_flux: 'Energy_Flux'
  energy_flux_err: 'Energy_Flux_Err'
  energy_flux_units: 'MeV cm-2 s-1'
  diff_flux_units: 'MeV-1 cm-2 s-1'
  x_ray_index: 'Swift_Photon_Index'
  gamma_ray_index: 'Fermi_Photon_Index'

fit_parameters:
  model: 'Log Parabola'

  # Power law parameters
  index: 2

  # Log parabola parameters
  fsrq_alpha: 2.5
  fsrq_beta: 0.05
  bll_alpha: 2.3
  bll_beta: -0.01
  bcu_alpha: 2
  bcu_beta: 0.01

  # Broken power law parameters
  break_energy: 1

  
